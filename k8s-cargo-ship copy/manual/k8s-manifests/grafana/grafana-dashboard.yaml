apiVersion: v1
kind: ConfigMap
metadata:
  name: node-exporter-dashboard
  namespace: cargo-ship-namespace
  labels:
    grafana_dashboard: "1"
data:
  node_exporter_full.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "iteration": 1649474601985,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "CPU Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "interval": "",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "title": "Memory Available",
          "type": "timeseries",
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes",
              "interval": "",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "title": "Filesystem Free Space",
          "type": "timeseries",
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{fstype!=\"tmpfs\",fstype!=\"overlay\"}",
              "interval": "",
              "legendFormat": "{{instance}} - {{mountpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "title": "Network Traffic (Receive)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total[5m])",
              "interval": "",
              "legendFormat": "{{instance}} - {{device}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 30,
      "style": "dark",
      "tags": ["node-exporter", "minimal"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "title": "Minimal Node Exporter",
      "uid": "minimal-node-exporter",
      "version": 1
    }
