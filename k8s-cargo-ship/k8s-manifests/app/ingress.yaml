---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo-ship-ingress
  namespace: cargo-ship-namespace
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: cargo-ship-clusterip
            port:
              number: 80
      - path: "/grafana"
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000