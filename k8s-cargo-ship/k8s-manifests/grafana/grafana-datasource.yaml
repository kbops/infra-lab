apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: cargo-ship-namespace
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.cargo-ship-namespace.svc.cluster.local:9090
        isDefault: true
        editable: true
