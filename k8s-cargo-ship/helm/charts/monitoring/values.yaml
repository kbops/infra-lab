prometheus:
  serviceAccounts:
    server:
      create: true
      name: "prometheus-sa"
      annotations: {}
  server:
    persistentVolume:
      enabled: false

grafana:
  admin:
    existingSecret: grafana-admin-secret
    passwordKey: admin-password
    userKey: admin-user
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      kubernetes.io/ingress.class: "nginx"
    labels: {}
    hosts:
      - a2fbc60a0e8ee4ff2b7bfa93b99efa2b-1264508776.eu-central-1.elb.amazonaws.com
    path: /grafana
    pathType: Prefix
    extraPaths: []
    tls: []
  serviceAccount:
    create: true
    name: grafana-sa
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-service.cargo-ship-namespace.svc.cluster.local:9090
          isDefault: true
          editable: true
  dashboardsProvider:
    dashboardsProvider.yaml:
      apiVersion: 1
      providers:
        - name: 'node-exporter-dashboards'
          orgId: 1
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
  dashboards:
    default:
      node_exporter_full:
        json: |
          {
            "annotations": {
              "list": [
                {
                  "builtIn": 1,
                  "datasource": "-- Grafana --",
                  "enable": true,
                  "hide": true,
                  "iconColor": "rgba(0, 211, 255, 1)",
                  "name": "Annotations & Alerts",
                  "type": "dashboard"
                }
              ]
            },
            "editable": true,
            "gnetId": null,
            "graphTooltip": 0,
            "id": null,
            "iteration": 1649474601985,
            "links": [],
            "panels": [
              {
                "datasource": "Prometheus",
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 0
                },
                "id": 1,
                "title": "CPU Usage",
                "type": "timeseries",
                "targets": [
                  {
                    "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                    "interval": "",
                    "legendFormat": "{{instance}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "datasource": "Prometheus",
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 0
                },
                "id": 2,
                "title": "Memory Available",
                "type": "timeseries",
                "targets": [
                  {
                    "expr": "node_memory_MemAvailable_bytes",
                    "interval": "",
                    "legendFormat": "{{instance}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "datasource": "Prometheus",
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 8
                },
                "id": 3,
                "title": "Filesystem Free Space",
                "type": "timeseries",
                "targets": [
                  {
                    "expr": "node_filesystem_avail_bytes{fstype!=\"tmpfs\",fstype!=\"overlay\"}",
                    "interval": "",
                    "legendFormat": "{{instance}} - {{mountpoint}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "datasource": "Prometheus",
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 8
                },
                "id": 4,
                "title": "Network Traffic (Receive)",
                "type": "timeseries",
                "targets": [
                  {
                    "expr": "rate(node_network_receive_bytes_total[5m])",
                    "interval": "",
                    "legendFormat": "{{instance}} - {{device}}",
                    "refId": "A"
                  }
                ]
              }
            ],
            "schemaVersion": 30,
            "style": "dark",
            "tags": ["node-exporter", "minimal"],
            "templating": {
              "list": []
            },
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "timepicker": {},
            "title": "Minimal Node Exporter",
            "uid": "minimal-node-exporter",
            "version": 1
          }
  grafana.ini:
    server:
      root_url: "/grafana"
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true