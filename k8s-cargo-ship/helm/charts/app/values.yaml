replicaCount: 2

image:
  repository: 106714502496.dkr.ecr.eu-central-1.amazonaws.com/cargo-ship
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.3" # latest is also acceptable.

DeploymentLabels:
  app: cargo-ship
  environment: production
  team: devops
  
podLabels:
  app: cargo-ship
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: flask-platform

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ingress:
#   enabled: true
#   className: ""
#   annotations: {}
#     # kubernetes.io/ingress.class: nginx
#     # kubernetes.io/tls-acme: "true"
#   hosts:
#     - host: chart-example.local
#       paths:
#         - path: /
#           pathType: ImplementationSpecific


ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: a2fbc60a0e8ee4ff2b7bfa93b99efa2b-1264508776.eu-central-1.elb.amazonaws.com
  paths:
    - path: /
      pathType: Prefix
    - path: /grafana
      pathType: Prefix

resources:
  limits:
    cpu: "0.1"
    memory: "200Mi"
  requests:
    cpu: "0.1"
    memory: "128Mi"

# # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

nodeSelector: {}
